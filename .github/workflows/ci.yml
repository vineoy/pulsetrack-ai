# CI (Phase 9): lint -> tests (fresh Postgres+Redis) -> prod image build.
# No secrets needed: tests use local services + mocked externals (Telegram/Gemini).
# Green main = safe to deploy (Northflank auto-deploys green mains).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Dummy secrets: the real .env is gitignored, and tests must never depend
    # on it. Mock transports intercept all HTTP, so these values never leave
    # the runner — they only satisfy the "token configured" guards.
    env:
      TELEGRAM_BOT_TOKEN: ci-dummy-token
      TELEGRAM_BOT_USERNAME: CiDummyBot
      GEMINI_API_KEY: ci-dummy-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulsetrack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulsetrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile.prod -t pulsetrack-api:ci ./backend
